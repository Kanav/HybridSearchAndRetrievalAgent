[project]
name = "hybrid-search-and-retrieval-agent"
version = "0.1.0"
description = "Hybrid Search and Retrieval Agent using Qdrant, FastEmbed, and Transformers"
authors = [
    { name = "Kanav Gupta" }
]
requires-python = ">=3.9"
dependencies = [
    "qdrant-client",
    "fastembed",
    "datasets",
    "transformers",
    "pandas",
    "numpy",
    "jsonschema"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[dependency-groups]
dev = []
